name: saas-tenant-api

# Shared definition for every PHP container (app, queue, scheduler)
x-php: &php
    build:
        context: .
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    image: saas-tenant-api/php:dev
    volumes:
        - .:/var/www/html
        - vendor:/var/www/html/vendor # dependencies live in a named volume (fast, no host/OS mismatch)

services:
    # Only this container bootstraps: .env, composer install, key, migrate, seed
    app:
        <<: *php
        environment:
            APP_ROLE: app
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'test -f /tmp/app-ready']
            interval: 5s
            timeout: 3s
            retries: 120
            start_period: 5s

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy

    queue:
        <<: *php
        command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
        environment:
            APP_ROLE: queue
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy

    scheduler:
        <<: *php
        command: php artisan schedule:work
        environment:
            APP_ROLE: scheduler
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-app}
            POSTGRES_USER: ${DB_USERNAME:-app}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    redis:
        image: redis:7-alpine
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redisdata:/data
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    vendor:
    pgdata:
    redisdata:
